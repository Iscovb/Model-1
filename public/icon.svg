<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="190" fill="#312e81" opacity="0.4" />

  <!-- Outer Knowledge Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Orbit nodes -->
  <circle cx="256" cy="96" r="14" fill="#38bdf8" />
  <circle cx="416" cy="256" r="14" fill="#c084fc" />
  <circle cx="256" cy="416" r="14" fill="#818cf8" />
  <circle cx="96" cy="256" r="14" fill="#38bdf8" />

  <!-- Center Card: Play & Knowledge Sparkle -->
  <g transform="translate(146, 146)">
    <!-- Shield / Book Backing -->
    <rect x="0" y="0" width="220" height="220" rx="44" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)" />
    
    <!-- Video Play triangle with AI glow -->
    <polygon points="90,75 155,110 90,145" fill="url(#goldGrad)" />

    <!-- Sparkle Stars -->
    <path d="M 180 40 Q 180 55 195 55 Q 180 55 180 70 Q 180 55 165 55 Q 180 55 180 40 Z" fill="#38bdf8" />
    <path d="M 45 170 Q 45 180 55 180 Q 45 180 45 190 Q 45 180 35 180 Q 45 180 45 170 Z" fill="#a855f7" />
  </g>
</svg>
